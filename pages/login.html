<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-precomposed.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به حساب کاربری | SPORTLINK</title>
    <meta name="description" content="ورود به حساب کاربری SPORTLINK با شماره موبایل یا ایمیل." />
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body data-page="login">
    <a href="#main-content" class="skip-link">رفتن به محتوای اصلی</a>
    <div id="site-header"></div>

    <main id="main-content">
      <section class="auth-section">
        <div class="container" style="display:flex;justify-content:center;">
          <div class="auth-card">
            <h1 style="font-size:1.5rem;margin-bottom:0.4rem;">ورود به SPORTLINK</h1>
            <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1.5rem;">
              نسخهٔ نمایشی به سرویس ورود متصل نیست؛ ورود با رمز عبور غیرفعال است.
            </p>

            <div id="session-expired-alert" class="form-alert is-info" hidden style="margin-bottom:1rem;">
              نشست شما به دلیل عدم فعالیت منقضی شده است. لطفاً دوباره وارد شوید.
            </div>
            <div id="login-form-alert" class="form-alert" hidden style="margin-bottom:1rem;"></div>

            <form id="login-form" class="form-stack" novalidate>
              <div class="form-group">
                <label class="form-label" for="login-identifier">شماره موبایل یا ایمیل</label>
                <input
                  type="text"
                  id="login-identifier"
                  class="form-control"
                  autocomplete="username"
                  placeholder="0915... یا name@example.com"
                />
                <span class="field-error" id="login-identifier-error"></span>
              </div>

              <div class="form-group">
                <label class="form-label" for="login-password">رمز عبور</label>
                <div class="input-with-action">
                  <input
                    type="password"
                    id="login-password"
                    class="form-control"
                    autocomplete="current-password"
                    placeholder="حداقل ۸ کاراکتر"
                  />
                  <button type="button" class="input-action-btn" id="login-toggle-pwd" aria-label="نمایش رمز عبور">نمایش</button>
                </div>
                <span class="field-error" id="login-password-error"></span>
              </div>

              <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.875rem;">
                <button type="button" id="forgot-password-btn" style="color:var(--accent-gold);padding:0;">فراموشی رمز عبور؟</button>
                <a href="/pages/register.html" style="color:var(--gray-light);">حساب ندارید؟ ثبت‌نام</a>
              </div>

              <button type="submit" class="btn btn-primary" id="login-submit-btn" style="width:100%;">ورود به حساب</button>
            </form>

          </div>
        </div>
      </section>
    </main>

    <div id="site-footer"></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
